linters-settings:
  gci:
    sections:
      - standard
      - default
      - localmodule
  dupl:
    threshold: 100
  errorlint:
    errorf: true
  errcheck:
    check-type-assertions: true
    check-blank: true
  exhaustive:
    check-generated: false
    default-signifies-exhaustive: false
  funlen:
    lines: 65
    statements: 40
  gocognit:
    min-complexity: 15
  gocyclo:
    min-complexity: 10
  goconst:
    min-len: 2
    min-occurrences: 2
  gocritic:
    enabled-tags:
      - diagnostic
      - experimental
      - opinionated
      - performance
      - style
    disabled-checks:
      - dupImport
      - unnecessaryBlock
  gofumpt:
    extra-rules: true
  gomnd:
    checks:
      - argument
      - case
      - condition
      - operation
      - return
  misspell:
    locale: US
    ignore-words:
      - cancelled
  nestif:
    min-complexity: 4
  nolintlint:
    require-explanation: true
    require-specific: true
  gosec:
    confidence: medium
  godox:
    keywords:
      - BUG
      - FIXME

linters:
  disable-all: true
  enable:
    - asciicheck
    - bodyclose
    - cyclop
    - dogsled
    - dupl
    - durationcheck
    - errcheck
    - errorlint
    - exhaustive
    - forbidigo
    - funlen
    - gci
    - gochecknoinits
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godot
    - godox
    - err113  # Replaces goerr113
    - gofmt
    - gofumpt
    - goimports
    - mnd  # Replaces gomnd
    - gomodguard
    - goprintffuncname
    - gosec
    - gosimple
    - govet
    - ineffassign
    - makezero
    - misspell
    - nakedret
    - nestif
    - nlreturn
    - noctx
    - nolintlint
    - paralleltest
    - predeclared
    - revive
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - unused  # Replaces structcheck, varcheck, and deadcode
    - stylecheck
    - tparallel
    - thelper
    - typecheck
    - unconvert
    - unparam
    - wsl
    - whitespace

issues:
  exclude-dirs:
    - docs
    - vendor
    - cmd
  exclude-rules:
    - path: integration-test
      linters:
        - paralleltest
        - godot
    - path: internal/app
      linters:
        - funlen # потому что Run всегда будет большим
        - gocyclo
        - cyclop
        - gocognit
    - path: internal/transport/broker
      linters:
        - mnd
    - path: internal/transport/broker/listener
      linters:
        - err113
    - path: internal/transport/grpc/resources
      linters:
        - revive
        - stylecheck
    - path: internal/transport/http/resources
      linters:
        - godot
        - errcheck

run:
  timeout: 5m
  tests: false
