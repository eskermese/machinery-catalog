stages:
  - check
  - build
  - integration

default:
  image: golang:1.26-alpine3.22
  tags:
    - docker

variables:
  GOFLAGS: -mod=vendor

.go-cache: &go-cache
  cache:
    key: "$CI_COMMIT_REF_SLUG-go"
    paths:
      - .go-build-cache
  before_script:
    - export GOCACHE="$CI_PROJECT_DIR/.go-build-cache"

lint:
  stage: check
  <<: *go-cache
  script:
    - apk add --no-cache git
    - go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8
    - golangci-lint run

test:
  stage: check
  <<: *go-cache
  script:
    - apk add --no-cache gcc musl-dev
    - go test -cover -race ./internal/... ./pkg/...

build:
  stage: build
  <<: *go-cache
  script:
    - go build -o /dev/null ./cmd/...

# Интеграционные тесты поднимают Postgres, Dragonfly и сам сервис через dockertest,
# поэтому джобе нужен доступ к Docker-демону (docker:dind).
integration:
  stage: integration
  image: docker:27-cli
  services:
    - name: docker:27-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_CERT_PATH: "/certs/client"
    DOCKER_TLS_VERIFY: 1
    # Имена контейнеров разводятся по веткам, чтобы параллельные пайплайны не конфликтовали.
    BRANCH_NAME: $CI_COMMIT_REF_SLUG
  before_script:
    - apk add --no-cache make
    - docker info
  script:
    - make integration
  after_script:
    - docker compose down --remove-orphans || true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - when: manual
      allow_failure: true
