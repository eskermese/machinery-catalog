        description: DownPaymentBps первоначальный взнос в базисных пунктах.
        example: 2000
        maximum: 10000
        minimum: 0
        type: integer
      rateBps:
        description: RateBps годовая ставка в базисных пунктах.
        example: 1800
        maximum: 10000
        minimum: 0
        type: integer
      scheduleType:
        description: 'ScheduleType тип графика: annuity или differentiated.'
        enum:
        - annuity
        - differentiated
        example: annuity
        type: string
