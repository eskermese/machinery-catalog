        type: string
      code:
        description: Машинный ключ
        example: engine_power
        type: string
      dataType:
        description: Тип значения
        example: number
        type: string
      id:
        description: Идентификатор
        example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
        type: string
      isFilterable:
        description: Показывать в фильтрах
        example: true
        type: boolean
      nameEN:
        description: Название на английском; пусто, пока нет перевода
        example: Engine power
        type: string
      nameKK:
        description: Название на казахском; пусто, пока нет перевода
        example: Қуаты
        type: string
      nameRU:
        description: Название на русском
        example: Мощность
        type: string
      numberMax:
        example: "420"
        type: string
      numberMin:
        description: |-
          NumberMin и NumberMax границы значений в разделе; пусто — значений нет
          или характеристика не числовая. Заполняются только публичной ручкой:
          из них витрина строит подсказку под полем фильтра.
        example: "55"
        type: string
      options:
        description: Варианты для типа enum
        items:
          $ref: '#/definitions/presenter.AttributeOption'
        type: array
      position:
        description: Порядок вывода
        example: 1
        type: integer
      unit:
        description: Единица измерения
        example: кВт
        type: string
