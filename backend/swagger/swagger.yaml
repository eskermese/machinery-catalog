basePath: /api
definitions:
  form.AttributeFilter:
    properties:
      attributeID:
        description: AttributeID характеристика, к которой применяется условие.
        example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
        type: string
      codes:
        description: Codes допустимые коды варианта; несколько означают «любой из».
        example:
        - crawler
        items:
          type: string
        type: array
      flag:
        description: Flag требуемое значение флаговой характеристики.
        example: true
        type: boolean
      numberMax:
        description: NumberMax верхняя граница числовой характеристики включительно.
        example: "250.5"
        type: string
      numberMin:
        description: NumberMin нижняя граница числовой характеристики включительно.
        example: "150"
        type: string
    required:
    - attributeID
    type: object
  form.AttributeOptionSave:
    properties:
      code:
        description: Code код варианта.
        example: crawler
        type: string
      nameEN:
        description: NameEN название на английском.
        example: Crawler
        type: string
      nameKK:
        description: NameKK название на казахском.
        example: Шынжыр табанды
        type: string
      nameRU:
        description: NameRU название на русском.
        example: Гусеничный
        type: string
      position:
        description: Position порядок вывода.
        example: 1
        minimum: 0
        type: integer
    required:
    - code
    - nameRU
    type: object
  form.AttributeSave:
    properties:
      categoryID:
        description: CategoryID категория, которой принадлежит характеристика.
        example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
        type: string
      code:
        description: Code машинный ключ характеристики.
        example: engine_power
        type: string
      dataType:
        description: 'DataType тип значения: number, string, bool или enum.'
        enum:
        - number
        - string
        - bool
        - enum
        example: number
        type: string
      isFilterable:
        description: IsFilterable выносить ли характеристику в панель фильтров.
        example: true
        type: boolean
      nameEN:
        description: NameEN название на английском.
        example: Engine power
        type: string
      nameKK:
        description: NameKK название на казахском.
        example: Қуаты
        type: string
      nameRU:
        description: NameRU название на русском.
        example: Мощность
        type: string
      options:
        description: Options варианты для типа enum.
        items:
          $ref: '#/definitions/form.AttributeOptionSave'
        type: array
      position:
        description: Position порядок вывода.
        example: 1
        minimum: 0
        type: integer
      unit:
        description: Unit единица измерения; допустима только у числовой характеристики.
        example: кВт
        type: string
    required:
    - categoryID
    - code
    - dataType
    - nameRU
    type: object
  form.AuthTokenIssue:
    properties:
      phone:
        description: Номер телефона
        example: "+77001234567"
        type: string
    required:
    - phone
    type: object
  form.AuthUserRename:
    properties:
      name:
        description: Name имя для показа; пустая строка очищает имя.
        example: Иван Петров
        type: string
    type: object
  form.CategorySave:
    properties:
      imagePath:
        description: |-
          ImagePath обложка раздела: путь в хранилище из ответа
          POST /v1/admin/media/categories. Пусто — обложку подставит сервис
          по первой опубликованной машине поддерева.
        example: categories/7c9e6679.jpg
        type: string
      isActive:
        description: IsActive видимость ветки на сайте.
        example: true
        type: boolean
      nameEN:
        example: Excavators
        type: string
      nameKK:
        description: |-
          NameKK и NameEN названия на казахском и английском.

          НЕОБЯЗАТЕЛЬНЫ, в отличие от русского. Русский — источник правды:
          витрина показывает его, пока перевода нет. Требовать перевод здесь
          значило бы запретить заводить раздел до того, как его перевели,
          а заглушка вместо перевода хуже пустоты — витрина не отличит её
          от настоящего названия.
        example: Экскаваторлар
        type: string
      nameRU:
        description: NameRU название на русском.
        example: Экскаваторы
        type: string
      parentID:
        description: ParentID родительская категория; пусто — корень.
        example: ""
        type: string
      position:
        description: Position порядок вывода.
        example: 1
        minimum: 0
        type: integer
      slug:
        description: Slug идентификатор в URL.
        example: excavators
        type: string
    required:
    - nameRU
    - slug
    type: object
  form.FXMarkupSave:
    properties:
      baseCurrency:
        description: BaseCurrency валюта, из которой считаем.
        example: CNY
        type: string
      effectiveFrom:
        description: EffectiveFrom момент вступления в силу; пусто — сейчас.
        type: string
      markupBps:
        description: |-
          MarkupBps наценка в базисных пунктах: 200 это 2 %.

          Базисные пункты, а не проценты дробью: целые участвуют в арифметике
          без ошибки округления, и наценка оказывается в той же единице,
          что ставка лизинга.
        example: 200
        minimum: 0
        type: integer
      quoteCurrency:
        description: QuoteCurrency валюта, в которую считаем.
        example: KZT
        type: string
    required:
    - baseCurrency
    - quoteCurrency
    type: object
  form.FXRateSave:
    properties:
      baseCurrency:
        description: BaseCurrency валюта, из которой считаем.
        example: CNY
        type: string
      quoteCurrency:
        description: QuoteCurrency валюта, в которую считаем.
        example: KZT
        type: string
      rate:
        description: |-
          Rate курс строкой: сколько единиц котируемой валюты за одну базовую.

          Строкой, а не числом: JSON-число прошло бы через двоичную плавающую
          точку и вернулось бы с хвостом в младшем разряде — а из этого курса
          считается цена всего каталога.
        example: "72.55"
        type: string
      rateDate:
        description: |-
          RateDate дата, на которую действует курс, в формате ГГГГ-ММ-ДД.
          Пусто — сегодня.
        example: "2026-09-01"
        type: string
    required:
    - baseCurrency
    - quoteCurrency
    - rate
    type: object
  form.LeadAssign:
    properties:
      managerID:
        description: ManagerID ответственный менеджер.
        example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
        type: string
    required:
    - managerID
    type: object
  form.LeadComment:
    properties:
      comment:
        description: Comment заметка менеджера по заявке.
        example: Перезвонить после обеда
        maxLength: 2000
        type: string
    type: object
  form.LeadCreate:
    properties:
      city:
        description: City город.
        example: Алматы
        type: string
      machineID:
        description: MachineID машина, из карточки которой пришла заявка.
        example: ""
        type: string
      message:
        description: |-
          Message что написал клиент: какая деталь нужна, к какой технике,
          что случилось. Необязательное.

          Отдельно от комментария менеджера: то поле принадлежит ему, и одно
          на двоих означало бы, что его правка затирает запрос клиента.
        example: Нужен масляный фильтр на XE215C
        maxLength: 2000
        type: string
      name:
        description: Name имя клиента.
        example: Иван
        type: string
      phone:
        description: 'Phone номер телефона в любом написании: нормализуется сервисом.'
        example: +7 (700) 111-22-33
        type: string
      quoteID:
        description: QuoteID коммерческое предложение, по которому обратились.
        example: ""
        type: string
      source:
        description: 'Source откуда пришла заявка: страница, форма или рекламная метка.'
        example: machine_card
        type: string
    required:
    - name
    - phone
    - source
    type: object
  form.LeadStatusChange:
    properties:
      status:
        description: Status целевой статус.
        enum:
        - new
        - in_progress
        - won
        - lost
        example: in_progress
        type: string
    required:
    - status
    type: object
  form.LeasingCalculate:
    properties:
      commissionKztCents:
        description: CommissionKztCents разовая комиссия в тиынах.
        example: 0
        minimum: 0
        type: integer
      downPaymentBps:
        description: 'DownPaymentBps первоначальный взнос в базисных пунктах: 20.00%
          это 2000.'
        example: 2000
        maximum: 10000
        minimum: 0
        type: integer
      leasingProgramID:
        description: LeasingProgramID выбранная программа; пусто — расчёт по переданным
          параметрам.
        example: ""
        type: string
      machineSlug:
        description: MachineSlug карточка, по цене которой считается платёж.
        example: xcmg-xe215c
        type: string
      rateBps:
        description: 'RateBps годовая ставка в базисных пунктах: 18% это 1800.'
        example: 1800
        maximum: 10000
        minimum: 0
        type: integer
      residualValueKztCents:
        description: ResidualValueKztCents выкупная стоимость в тиынах.
        example: 0
        minimum: 0
        type: integer
      scheduleType:
        description: 'ScheduleType тип графика: annuity или differentiated.'
        enum:
        - annuity
        - differentiated
        example: annuity
        type: string
      termMonths:
        description: TermMonths срок в месяцах.
        example: 36
        maximum: 360
        type: integer
    required:
    - machineSlug
    - scheduleType
    - termMonths
    type: object
  form.LeasingProgramSave:
    properties:
      id:
        description: ID программы; пусто — создание новой.
        example: ""
        type: string
      isActive:
        description: IsActive действует ли программа.
        example: true
        type: boolean
      logoPath:
        description: LogoPath путь к логотипу партнёра внутри хранилища.
        example: ""
        type: string
      maxAmountCnyCents:
        description: MaxAmountCnyCents потолок суммы сделки в фынях (1/100 юаня);
          пусто — без потолка.
        example: 50000000
        type: integer
      minDownPaymentBps:
        description: MinDownPaymentBps минимальный первоначальный взнос в базисных
          пунктах.
        example: 1500
        maximum: 10000
        minimum: 0
        type: integer
      nameEN:
        description: NameEN название на английском.
        example: Halyk Leasing
        type: string
      nameKK:
        description: NameKK название на казахском.
        example: Halyk Leasing
        type: string
      nameRU:
        description: NameRU название на русском.
        example: Halyk Leasing
        type: string
      position:
        description: Position порядок вывода.
        example: 1
        minimum: 0
        type: integer
      rateMaxBps:
        description: RateMaxBps верхняя граница ставки в базисных пунктах.
        example: 2400
        minimum: 0
        type: integer
      rateMinBps:
        description: RateMinBps нижняя граница ставки в базисных пунктах.
        example: 1800
        minimum: 0
        type: integer
      termMonthsMax:
        description: TermMonthsMax верхняя граница срока в месяцах.
        example: 60
        type: integer
      termMonthsMin:
        description: TermMonthsMin нижняя граница срока в месяцах.
        example: 12
        type: integer
    required:
    - nameEN
    - nameKK
    - nameRU
    - termMonthsMax
    - termMonthsMin
    type: object
  form.MachineAttributeValueSave:
    properties:
      attributeID:
        description: AttributeID характеристика.
        example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
        type: string
      code:
        description: Code код варианта для характеристики типа enum.
        example: crawler
        type: string
      flag:
        description: Flag значение флаговой характеристики.
        example: true
        type: boolean
      number:
        description: Number числовое значение строкой, чтобы не терять разряды на
          float64.
        example: "155"
        type: string
      text:
        description: Text строковое значение.
        example: ""
        type: string
    required:
    - attributeID
    type: object
  form.MachineImageSave:
    properties:
      altEN:
        description: AltEN подпись на английском.
        example: ""
        type: string
      altKK:
        description: AltKK подпись на казахском.
        example: ""
        type: string
      altRU:
        description: AltRU подпись на русском.
        example: ""
        type: string
      isPrimary:
        description: IsPrimary главное фото; допустимо не более одного на карточку.
        example: true
        type: boolean
      path:
        description: Path путь в файловом хранилище.
        example: machines/xcmg-xe215c-1.jpg
        type: string
      position:
        description: Position порядок показа.
        example: 0
        minimum: 0
        type: integer
    required:
    - path
    type: object
  form.MachineImagesReplace:
    properties:
      images:
        description: Images новый набор фотографий; пустой набор очищает галерею.
        items:
          $ref: '#/definitions/form.MachineImageSave'
        type: array
    type: object
  form.MachineSave:
    properties:
      attributeValues:
        description: AttributeValues значения характеристик.
        items:
          $ref: '#/definitions/form.MachineAttributeValueSave'
        type: array
      availability:
        description: 'Availability наличие: in_stock или on_order.'
        enum:
        - in_stock
        - on_order
        example: in_stock
        type: string
      brand:
        description: Brand бренд.
        example: XCMG
        type: string
      categoryID:
        description: CategoryID категория карточки.
        example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
        type: string
      condition:
        description: 'Condition состояние: new или used.'
        enum:
        - new
        - used
        example: new
        type: string
      deliveryWeeks:
        description: DeliveryWeeks срок поставки в неделях.
        example: 8
        type: integer
      descriptionEN:
        description: DescriptionEN описание на английском.
        example: ""
        type: string
      descriptionKK:
        description: DescriptionKK описание на казахском.
        example: ""
        type: string
      descriptionRU:
        description: DescriptionRU описание на русском.
        example: ""
        type: string
      fuelConsumptionLph:
        description: |-
          FuelConsumptionLph расход топлива в литрах на моточас.

          Строкой, а не числом: расход паспортный и дробный («12.7»), и float64
          на границе контракта — лишний повод для расхождения в младшем разряде.
          Пусто — не заведён, и расчёт стоимости владения так и скажет.
        example: "12.7"
        type: string
      images:
        description: Images фотографии карточки.
        items:
          $ref: '#/definitions/form.MachineImageSave'
        type: array
      isPricePublic:
        description: IsPricePublic показывать ли цену на витрине.
        example: true
        type: boolean
      model:
        description: Model модель.
        example: XE215C
        type: string
      nameEN:
        description: NameEN название на английском.
        example: XCMG XE215C excavator
        type: string
      nameKK:
        description: NameKK название на казахском.
        example: XCMG XE215C экскаваторы
        type: string
      nameRU:
        description: NameRU название на русском.
        example: Экскаватор XCMG XE215C
        type: string
      priceCnyCents:
        description: |-
          PriceCNYCents цена в фынях (1/100 юаня).

          Целое в центах, а не доллары строкой или числом: на границе не должно
          быть места для потери точности, а «89500.00» пришлось бы разбирать
          и округлять — то есть заводить ровно тот шаг, где точность и теряется.
        example: 8950000
        minimum: 0
        type: integer
      productionYear:
        description: ProductionYear год выпуска.
        example: 2024
        maximum: 2100
        minimum: 1950
        type: integer
      serviceCostCnyCents:
        description: |-
          ServiceCostCnyCents стоимость одного планового ТО в фынях (1/100 юаня);
          пусто — не заведена.
        example: 120000
        minimum: 0
        type: integer
      serviceIntervalHours:
        description: ServiceIntervalHours моточасов между плановыми ТО; пусто — не
          заведён.
        example: 500
        type: integer
      slug:
        description: Slug идентификатор в URL.
        example: xcmg-xe215c
        type: string
    required:
    - availability
    - brand
    - categoryID
    - condition
    - model
    - nameRU
    - slug
    type: object
  form.MachineSearch:
    properties:
      attributes:
        description: Attributes условия по характеристикам, произвольный набор.
        items:
          $ref: '#/definitions/form.AttributeFilter'
        type: array
      availability:
        description: 'Availability наличие: in_stock или on_order.'
        enum:
        - in_stock
        - on_order
        example: in_stock
        type: string
      categoryID:
        description: CategoryID ограничивает выдачу категорией.
        example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
        type: string
      condition:
        description: 'Condition состояние: new или used.'
        enum:
        - new
        - used
        example: new
        type: string
      cursor:
        description: Cursor курсор следующей страницы, полученный в предыдущем ответе.
        example: ""
        type: string
      includeSubcategories:
        description: IncludeSubcategories расширяет отбор на всё поддерево категории.
        example: true
        type: boolean
      isActive:
        description: |-
          IsActive отбирает опубликованные (true) или черновики (false).

          На публичной витрине игнорируется: там признак уже зафиксирован,
          и переопределить его параметром запроса нельзя.
        example: false
        type: boolean
      limit:
        description: Limit размер страницы. Значение сверх допустимого урезается до
          максимума.
        example: 20
        minimum: 0
        type: integer
      priceMaxCents:
        description: PriceMaxCents верхняя граница цены в фынях (1/100 юаня) включительно.
        example: 15000000
        minimum: 0
        type: integer
      priceMinCents:
        description: PriceMinCents нижняя граница цены в фынях (1/100 юаня) включительно.
        example: 5000000
        minimum: 0
        type: integer
      productionYearMax:
        description: ProductionYearMax верхняя граница года выпуска включительно.
        example: 2026
        maximum: 2100
        minimum: 1950
        type: integer
      productionYearMin:
        description: ProductionYearMin нижняя граница года выпуска включительно.
        example: 2018
        maximum: 2100
        minimum: 1950
        type: integer
      query:
        description: |-
          Query подстрока для поиска по названию, бренду и модели.

          Одно поле и для витрины, и для админки: ищутся одни и те же колонки,
          а видимость черновиков решает не оно.
        example: экскаватор
        maxLength: 200
        type: string
      sort:
        description: 'Sort порядок сортировки: price_asc, price_desc или published_desc.'
        enum:
        - price_asc
        - price_desc
        - published_desc
        example: price_asc
        type: string
      withTotal:
        description: |-
          WithTotal просить ли общее число найденных карточек.

          Стоит второго запроса по тому же предикату, поэтому по умолчанию
          выключено: бесконечной прокрутке итог не нужен.
        example: false
        type: boolean
    type: object
  form.PriceSettingsSave:
    properties:
      showUsdPrice:
        description: ShowUSDPrice показывать ли цену в долларах на витрине.
        example: true
        type: boolean
    type: object
  form.QuoteIssue:
    properties:
      commissionKztCents:
        description: CommissionKztCents разовая комиссия в тиынах.
        example: 0
        minimum: 0
        type: integer
      configuration:
        additionalProperties: {}
        description: Configuration выбранная комплектация и опции.
        type: object
      downPaymentBps:
        description: 'DownPaymentBps первоначальный взнос в базисных пунктах: 20.00%
          это 2000.'
        example: 2000
        maximum: 10000
        minimum: 0
        type: integer
      leasingProgramID:
        description: LeasingProgramID выбранная программа; пусто — расчёт по переданным
          параметрам.
        example: ""
        type: string
      machineSlug:
        description: MachineSlug карточка, по которой выпускается предложение.
        example: xcmg-xe215c
        type: string
      rateBps:
        description: 'RateBps годовая ставка в базисных пунктах: 18% это 1800.'
        example: 1800
        minimum: 0
        type: integer
      residualValueKztCents:
        description: ResidualValueKztCents выкупная стоимость в тиынах.
        example: 0
        minimum: 0
        type: integer
      scheduleType:
        description: 'ScheduleType тип графика: annuity или differentiated.'
        enum:
        - annuity
        - differentiated
        example: annuity
        type: string
      termMonths:
        description: TermMonths срок в месяцах.
        example: 36
        type: integer
      validForDays:
