        Черновики не возвращаются ни при каких параметрах, включая isActive — на витрине
        он игнорируется. Поиск query ищет подстроку в названии, бренде и модели. Цена
        в тенге приходит вместе с датой курса; при отсутствии курса обоих полей нет,
        а выдача работает как обычно
      parameters:
      - description: Условия поиска
        in: body
        name: filter
