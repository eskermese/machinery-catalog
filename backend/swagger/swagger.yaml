  form.ResidualValueCurveSave:
    properties:
      annualDropBps:
        description: AnnualDropBps сколько теряется за каждый следующий год ОТ ОСТАТКА.
        example: 1200
        maximum: 10000
        minimum: 0
        type: integer
      firstYearDropBps:
        description: |-
          FirstYearDropBps сколько техника теряет за первый год, в базисных пунктах.

          Отдельно от остальных лет: за первый год техника теряет заметно больше,
          и одна ставка на все годы либо завысила бы остаток свежей машины,
          либо занизила бы старой.
        example: 2000
        maximum: 10000
        minimum: 0
        type: integer
      floorBps:
        description: |-
          FloorBps доля, ниже которой стоимость не опускается.

          Чистая геометрия на длинном горизонте уводит цену почти в ноль, чего
          с техникой не происходит: у неё есть цена узлов и металла.
        example: 2000
        maximum: 10000
        minimum: 0
        type: integer
    type: object
  form.TCOCalculate:
    properties:
      fuelPriceKztCents:
        description: FuelPriceKztCents цена литра топлива в тиынах.
        example: 29000
        minimum: 0
        type: integer
      hoursPerYear:
        description: HoursPerYear наработка в моточасах за год.
        example: 1500
        maximum: 8760
        type: integer
      operatorHourlyKztCents:
        description: OperatorHourlyKztCents оплата оператора за моточас в тиынах.
        example: 250000
        minimum: 0
        type: integer
      years:
        description: Years срок владения в годах.
        example: 5
        maximum: 30
        type: integer
    required:
    - hoursPerYear
    - years
    type: object
  presenter.Attribute:
