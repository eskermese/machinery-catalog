        type: array
      scheduleType:
        description: Тип графика
        example: annuity
        type: string
      termMonths:
        description: Срок в месяцах
        example: 36
        type: integer
      totalInterestKztCents:
        description: Проценты за срок
        example: 1414964100
        type: integer
      totalPaidKztCents:
        description: Итого выплат
        example: 5155718500
        type: integer
