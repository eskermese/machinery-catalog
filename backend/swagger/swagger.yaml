        "400":
          description: 'Код ошибки: невалидный фильтр или испорченный курсор'
          schema:
            $ref: '#/definitions/swagger.HTTPResponse400'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/swagger.HTTPResponse500'
      summary: Поиск по каталогу
      tags:
      - catalog
