  /v1/leasing/calculate:
    post:
      consumes:
      - application/json
      description: 'Справочный расчёт по опубликованной карточке. Цену и курс сервер
        берёт сам: цену по слагу, курс — действующий. Ничего не сохраняется и не фиксируется.
        Машина со скрытой ценой отвергается. Частота обращений с одного адреса ограничена'
