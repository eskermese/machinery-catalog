  presenter.FXStatusList:
    properties:
      items:
        description: Состояние по каждой паре
        items:
          $ref: '#/definitions/presenter.FXPairStatus'
        type: array
      showUsdPrice:
        description: |-
          ShowUsdPrice включён ли показ цены в долларах. Лежит здесь, а не
          отдельной ручкой: админка показывает состояние пары CNY→USD и этот
